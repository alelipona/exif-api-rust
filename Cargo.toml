[package]
name = "exif-api"
version = "1.0.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-multipart = "0.6"
actix-cors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.10"
log = "0.4"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
anyhow = "1"
exiftool-rs = "0.7.4"
futures-util = "0.3"

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
